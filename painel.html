<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rota do Dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151a; --surface: #1a1f27; --surface-2: #232a34;
    --border: #313a47; --border-soft: #262e39;
    --text: #e9e7e0; --text-muted: #838d9c; --text-faint: #545e6c;
    --steel: #5b83a6; --steel-dim: #3a5468;
    --bronze: #c0834a; --bronze-dim: #382c1e;
    --success: #5a9c78; --success-dim: #24322b;
    --fail: #a85a4a; --fail-dim: #3a2a26;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh; display: flex; justify-content: center; padding: 28px 16px 80px;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(91,131,166,0.07), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(192,131,74,0.05), transparent 40%);
  }
  .app { width: 100%; max-width: 480px; }

  .app-header { text-align: center; margin-bottom: 22px; }
  .app-header .mark { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-faint); }
  .app-header .title {
    font-size: 27px; font-weight: 700; letter-spacing: -0.02em; margin-top: 3px;
    background: linear-gradient(90deg, var(--steel) 15%, var(--bronze) 85%);
    -webkit-background-clip: text; background-clip: text; color: transparent; display: inline-block;
  }
  .app-header .rule { width: 46px; height: 2px; margin: 10px auto 0; border-radius: 2px; background: linear-gradient(90deg, var(--steel), var(--bronze)); }
  .header-actions { display: flex; justify-content: center; margin-top: 10px; }
  .edit-toggle {
    display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px; color: var(--text-muted); font-size: 12px; cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
  }
  .edit-toggle:hover { border-color: var(--steel); color: var(--steel); }
  .edit-toggle.active { border-color: var(--bronze); color: var(--bronze); background: var(--bronze-dim); }

  .day-nav { display: flex; align-items: center; justify-content: space-between; margin: 20px 0; }
  .nav-btn {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface);
    color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px;
  }
  .nav-btn:hover { border-color: var(--steel); color: var(--steel); }
  .day-label { text-align: center; }
  .day-label .weekday { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bronze); margin-bottom: 2px; }
  .day-label .date { font-size: 21px; font-weight: 600; letter-spacing: -0.01em; }

  .loading { text-align: center; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 30px 0; }

  .summary { display: flex; gap: 8px; margin-bottom: 22px; }
  .summary-card { flex: 1; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius); padding: 12px 14px; }
  .summary-card .num { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
  .summary-card .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .summary-card.ok .num { color: var(--success); }

  .section-divider { display: flex; align-items: center; gap: 10px; margin: 20px 0 10px; }
  .section-divider .line { flex: 1; height: 1px; background: var(--border-soft); }
  .section-divider .label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-faint); white-space: nowrap; }

  .item-card {
    background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 8px;
  }
  .item-card.status-Concluido { border-color: var(--success-dim); }
  .item-card.status-NaoConcluido { border-color: var(--fail-dim); }
  .item-time { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-faint); }
  .item-title { font-size: 14px; font-weight: 500; margin-top: 2px; }
  .item-card.status-Concluido .item-title, .item-card.status-NaoConcluido .item-title { color: var(--text-muted); }
  .item-actions { display: flex; gap: 8px; margin-top: 9px; }
  .action-btn {
    flex: 1; border: 1px solid var(--border); background: transparent; color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; font-weight: 500;
    padding: 7px 0; border-radius: 7px; cursor: pointer;
  }
  .action-btn.ok.active { background: var(--success-dim); border-color: var(--success); color: var(--success); }
  .action-btn.no.active { background: var(--fail-dim); border-color: var(--fail); color: var(--fail); }
  .status-tag { display: inline-flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; margin-top: 8px; }
  .status-tag.Concluido { color: var(--success); }
  .status-tag.NaoConcluido { color: var(--fail); }
  .status-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

  .edit-panel { display: none; }
  .edit-panel.show { display: block; }
  .edit-note { font-size: 11.5px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; line-height: 1.5; }
  .edit-row { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
  .edit-row input[type="time"] { width: 78px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 5px 6px; }
  .edit-row input[type="text"] { flex: 1; background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; color: var(--text); font-family: 'Space Grotesk', sans-serif; font-size: 13px; padding: 6px 8px; min-width: 0; }
  .apply-option { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12.5px; color: var(--text-muted); }
  .edit-actions { display: flex; gap: 8px; margin-top: 16px; }
  .edit-actions .cancel-btn { flex: 1; padding: 12px 0; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text-muted); font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; cursor: pointer; }
  .edit-actions .save-btn { flex: 2; padding: 12px 0; border: 1px solid var(--success); border-radius: var(--radius); background: var(--success-dim); color: var(--success); font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; }

  .save-day-btn {
    width: 100%; margin-top: 20px; padding: 15px 0; border: 1px solid var(--bronze); border-radius: var(--radius);
    background: linear-gradient(135deg, var(--bronze-dim), var(--surface) 80%); color: var(--bronze);
    font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  }
  .save-confirm { text-align: center; font-size: 11.5px; color: var(--success); font-family: 'IBM Plex Mono', monospace; margin-top: 10px; opacity: 0; transition: opacity 0.2s ease; }
  .save-confirm.show { opacity: 1; }
  .footer-note { text-align: center; margin-top: 24px; font-size: 11px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <div class="mark">STABILIS · PRODUTIVIDADE PESSOAL</div>
    <div class="title">Rota do Dia</div>
    <div class="rule"></div>
    <div class="header-actions">
      <button class="edit-toggle" id="editToggle">✏️ Editar rotina</button>
    </div>
  </div>

  <div class="day-nav">
    <button class="nav-btn" id="prevDay" aria-label="Dia anterior">‹</button>
    <div class="day-label">
      <span class="weekday" id="weekdayLabel">—</span>
      <span class="date" id="dateLabel">—</span>
    </div>
    <button class="nav-btn" id="nextDay" aria-label="Próximo dia">›</button>
  </div>

  <div id="conteudo">
    <div class="loading">carregando o dia...</div>
  </div>

  <button class="save-day-btn" id="saveDayBtn" style="display:none;">Salvar dia e avançar <span>→</span></button>
  <div class="save-confirm" id="saveConfirm"></div>

  <div class="footer-note">rota do dia · stabilis</div>
</div>

<script>
  // ⚠️ atualizar sempre que reimplantar o Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnLjL6rqu6ShvSiKGsEPlddNjJKUR1MYHm3KmEZauNtlQXIsnqY8FRUPL3hevRZsjRfg/exec";

  let dataAtual = new Date();
  let itensDoDia = [];

  function formatarDataBR(d) {
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    return dd + "/" + mm + "/" + d.getFullYear();
  }
  const diasSemana = ["Domingo", "Segunda-feira", "Terça-feira", "Quarta-feira", "Quinta-feira", "Sexta-feira", "Sábado"];

  function renderCabecalhoData() {
    document.getElementById("weekdayLabel").textContent = diasSemana[dataAtual.getDay()];
    document.getElementById("dateLabel").textContent = formatarDataBR(dataAtual);
  }

  async function carregarDia() {
    document.getElementById("conteudo").innerHTML = '<div class="loading">carregando o dia...</div>';
    document.getElementById("saveDayBtn").style.display = "none";
    renderCabecalhoData();
    const dataStr = formatarDataBR(dataAtual);
    try {
      const resp = await fetch(SCRIPT_URL + "?action=getDia&data=" + encodeURIComponent(dataStr));
      const json = await resp.json();
      itensDoDia = json.itens || [];
      renderDia();
    } catch (err) {
      document.getElementById("conteudo").innerHTML = '<div class="loading">erro ao carregar — confira a SCRIPT_URL</div>';
    }
  }

  function renderDia() {
    const cont = document.getElementById("conteudo");
    cont.innerHTML = "";

    const concluidos = itensDoDia.filter(i => i.status === "Concluido").length;
    const naoConcluidos = itensDoDia.filter(i => i.status === "NaoConcluido").length;
    const pendentes = itensDoDia.length - concluidos - naoConcluidos;

    const summary = document.createElement("div");
    summary.className = "summary";
    summary.innerHTML = `
      <div class="summary-card ok"><div class="num">${concluidos}</div><div class="lbl">Concluídas</div></div>
      <div class="summary-card"><div class="num">${naoConcluidos}</div><div class="lbl">Não concluídas</div></div>
      <div class="summary-card"><div class="num">${pendentes}</div><div class="lbl">Pendentes</div></div>`;
    cont.appendChild(summary);

    let ultimoTipo = null;
    // ordena pelo horário
    const ordenado = [...itensDoDia].sort((a, b) => a.horario.localeCompare(b.horario));

    ordenado.forEach(item => {
      if (item.tipo !== ultimoTipo) {
        const div = document.createElement("div");
        div.className = "section-divider";
        div.innerHTML = `<div class="line"></div><div class="label">${item.tipo || "Outros"}</div><div class="line"></div>`;
        cont.appendChild(div);
        ultimoTipo = item.tipo;
      }

      const card = document.createElement("div");
      card.className = "item-card status-" + item.status;
      let acao = "";
      if (item.status === "Pendente") {
        acao = `
          <div class="item-actions">
            <button class="action-btn ok" data-id="${item.configId}" data-status="Concluido">Concluído</button>
            <button class="action-btn no" data-id="${item.configId}" data-status="NaoConcluido">Não consegui</button>
          </div>`;
      } else {
        const label = item.status === "Concluido" ? "Concluído" : "Não concluído";
        const hora = item.dataHoraResposta ? new Date(item.dataHoraResposta).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"}) : "";
        acao = `<div class="status-tag ${item.status}"><span class="dot"></span> ${label}${hora ? " às " + hora : ""}</div>`;
      }
      card.innerHTML = `<div class="item-time">${item.horario}</div><div class="item-title">${item.atividade}</div>${acao}`;
      cont.appendChild(card);
    });

    cont.querySelectorAll(".action-btn").forEach(btn => {
      btn.addEventListener("click", () => marcarStatus(btn.dataset.id, btn.dataset.status));
    });

    document.getElementById("saveDayBtn").style.display = "flex";
  }

  async function marcarStatus(configId, status) {
    const dataStr = formatarDataBR(dataAtual);
    await fetch(SCRIPT_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "marcarStatus", data: dataStr, configId: configId, status: status })
    });
    const item = itensDoDia.find(i => i.configId === configId);
    if (item) { item.status = status; item.dataHoraResposta = new Date().toISOString(); }
    renderDia();
  }

  document.getElementById("prevDay").addEventListener("click", () => {
    dataAtual.setDate(dataAtual.getDate() - 1);
    carregarDia();
  });
  document.getElementById("nextDay").addEventListener("click", () => {
    dataAtual.setDate(dataAtual.getDate() + 1);
    carregarDia();
  });

  document.getElementById("saveDayBtn").addEventListener("click", async () => {
    const dataStr = formatarDataBR(dataAtual);
    await fetch(SCRIPT_URL, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "fecharDia", data: dataStr })
    });
    const confirmEl = document.getElementById("saveConfirm");
    confirmEl.textContent = "✓ dia de " + dataStr + " salvo no histórico";
    confirmEl.classList.add("show");
    setTimeout(() => {
      confirmEl.classList.remove("show");
      dataAtual.setDate(dataAtual.getDate() + 1);
      carregarDia();
    }, 900);
  });

  // ---- modo edição ----
  document.getElementById("editToggle").addEventListener("click", carregarEdicao);

  async function carregarEdicao() {
    const toggle = document.getElementById("editToggle");
    const cont = document.getElementById("conteudo");
    document.getElementById("saveDayBtn").style.display = "none";
    cont.innerHTML = '<div class="loading">carregando rotina...</div>';
    toggle.textContent = "✕ Fechar edição";

    const resp = await fetch(SCRIPT_URL + "?action=getConfig");
    const json = await resp.json();
    const itens = json.config || [];

    let html = `<div class="edit-panel show">
      <div class="edit-note">Edite horário e nome. As mudanças passam a valer a partir de amanhã, a menos que você marque "aplicar também hoje".</div>
      <div id="editRows"></div>
      <label class="apply-option"><input type="checkbox" id="applyToday"> Aplicar também no dia de hoje</label>
      <div class="edit-actions">
        <button class="cancel-btn" id="cancelEdit">Cancelar</button>
        <button class="save-btn" id="confirmEdit">Salvar rotina</button>
      </div>
    </div>`;
    cont.innerHTML = html;

    const rowsDiv = document.getElementById("editRows");
    itens.forEach(item => {
      const row = document.createElement("div");
      row.className = "edit-row";
      row.dataset.id = item.id;
      row.dataset.tipo = item.tipo;
      row.dataset.alerta = item.alerta || "";
      row.innerHTML = `<input type="time" value="${item.horario}"><input type="text" value="${item.atividade}">`;
      rowsDiv.appendChild(row);
    });

    document.getElementById("cancelEdit").addEventListener("click", () => {
      toggle.textContent = "✏️ Editar rotina";
      carregarDia();
    });

    document.getElementById("confirmEdit").addEventListener("click", async () => {
      const aplicarHoje = document.getElementById("applyToday").checked;
      const novosItens = [...rowsDiv.children].map(row => ({
        id: row.dataset.id,
        tipo: row.dataset.tipo,
        alerta: row.dataset.alerta,
        horario: row.querySelector('input[type="time"]').value,
        atividade: row.querySelector('input[type="text"]').value
      }));
      await fetch(SCRIPT_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "salvarRotina", itens: novosItens, aplicarHoje: aplicarHoje })
      });
      toggle.textContent = "✏️ Editar rotina";
      carregarDia();
    });
  }

  carregarDia();
</script>
</body>
</html>
